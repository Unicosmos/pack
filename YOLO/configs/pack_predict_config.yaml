# YOLO预测配置文件
# 用于包装检测预测任务

# 基础任务配置
task: segment  # 任务类型：segment(实例分割)

# 项目管理配置
project: runs/predict  # 结果保存目录
# project: mypack/valid  # 结果保存目录
# name: pack_predict  # 实验名称
name: lscd_predict
# 模型和数据配置
# 预训练模型路径 - 使用训练好的模型
# model: D:\A_pack\pack\YOLO\runs\lscd_segmentation_20260504232735\weights\best.pt # 训练好的模型路径
model: D:\A_pack\pack\YOLO\runs\lscd_segmentation_20260510140818\weights\best.pt

# 数据源配置
source:  D:\A_pack\pack\SKU\source # 输入源：图片路径、目录、视频等

# 预测参数
imgsz: 640      # 输入图像尺寸
conf: 0.35      # 置信度阈值
iou: 0.7       # NMS IoU阈值
max_det: 100    # 每张图像最大检测数
device: cpu       # 设备选择，使用第0号GPU
half: false     # 是否使用FP16半精度推理

# 输出配置
save: true           # 保存预测结果图像
save_json: true      # 保存结果到JSON文件
save_txt: true       # 保存结果为YOLO格式标注文件
exist_ok: false      # 是否允许覆盖已存在的实验目录

# 显示配置
show: true          # 是否显示预测结果
verbose: true        # 是否显示详细预测日志

# 其他配置
classes: null        # 指定检测的类别ID列表，null表示检测所有类别
agnostic_nms: false  # 是否使用类别无关的NMS
augment: false       # 推理时是否使用TTA
